name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel superseded runs on the same ref (e.g. new push to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint runs first, and it is the cheapest step by an order of magnitude —
      # about three seconds against thirty for the build. It is also the one the
      # pre-commit hook already ran on the staged files, so a failure here means
      # either the hook was skipped or a file changed that the author did not
      # stage. Either way you want to know before waiting for a build.
      #
      # It covers the three packages since `apps/api` and `packages/shared` got
      # their own ESLint config; `turbo run lint` used to walk the workspace and
      # find a single task, which is a green tick on almost nothing.
      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
