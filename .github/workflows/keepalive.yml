name: Keep API awake

# Render free web services sleep after ~15 min of inactivity (cold start).
# This pings the health endpoint periodically to keep it warm.
# NOTE: GitHub scheduled workflows are best-effort and often delayed by
# 10-15+ min, so this reduces cold starts but does not guarantee zero.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 \
            https://chantia-api.onrender.com/health
