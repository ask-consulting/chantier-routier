# Render Blueprint — deploys the back-end API (apps/api) as a Docker web service.
# Docs: https://render.com/docs/blueprint-spec
#
# Setup: on Render, New > Blueprint, connect this repo. Render reads this file.
# Then fill the secret env vars (DATABASE_URL, DIRECT_URL, CORS_ORIGINS) in the
# dashboard — they are marked `sync: false` so they are NOT stored in git.
#
# The container applies pending Prisma migrations on boot (see Dockerfile.prod
# CMD: `prisma migrate deploy && node dist/main.js`).

services:
  - type: web
    name: chantia-api
    runtime: docker
    repo: https://github.com/ask-consulting/chantier-routier
    plan: free
    region: frankfurt            # closest free region to France/Maghreb
    dockerfilePath: ./apps/api/Dockerfile.prod
    dockerContext: .             # build from the monorepo root
    healthCheckPath: /health
    autoDeploy: true             # redeploy on push to the deployed branch
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; the app reads process.env.PORT.
      # Runtime DB connection (use the Supabase POOLER url here).
      - key: DATABASE_URL
        sync: false
      # Direct DB connection for migrations (use the Supabase DIRECT url here).
      - key: DIRECT_URL
        sync: false
      # Comma-separated allowed origins (e.g. your Vercel web URL).
      - key: CORS_ORIGINS
        sync: false
      # Where the front is reachable — this is what turns an invitation path into
      # a clickable link inside the email. Its absence is why invitations sent
      # from production on 2 September pointed at http://localhost:3000: the API
      # fell back to its development default and said nothing. It now refuses to
      # boot without it, and the value lives here rather than in the dashboard so
      # the next environment cannot forget it silently.
      - key: WEB_APP_URL
        value: https://chantier-routier.vercel.app
      # HS256 secret signing the access tokens. `generateValue` lets Render mint
      # it once and keep it out of git; the API refuses to boot without it.
      # Rotating this value invalidates every live access token — users simply
      # log in again.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: chantia-identity
      # Render's edge appends the real client address to X-Forwarded-For, so the
      # rate limiter counts one hop back from the right to find it. Left at the
      # default 0, every request would look like it came from the proxy and the
      # first few callers would lock out everyone else.
      - key: TRUSTED_PROXY_HOPS
        value: 1
      # Email. HTTP API rather than SMTP because free web services here cannot
      # open ports 25, 465 or 587 outbound — an SMTP transport would simply hang.
      # Brevo's free plan sends 300 a day from a mailbox verified by clicking a
      # link, which is what this project needs: it owns no domain.
      - key: EMAIL_PROVIDER
        value: brevo
      # v3 API key — app.brevo.com > SMTP & API > API keys.
      - key: BREVO_API_KEY
        sync: false
      # Must be a sender Brevo has verified, or every send comes back HTTP 400.
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: Chantia
